name: 이터널 리턴 알림

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 사정으로 몇 분 늦게 돌 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "normal = 평소처럼 / check = 보냄·건너뜀 목록만 로그에 출력 / test = 필터 통과하는 최신 공지·영상 1개씩 강제 전송"
        type: choice
        options: [normal, check, test]
        default: normal

permissions:
  contents: write             # state.json 커밋용

concurrency:
  group: er-news-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 공지·영상 확인 후 전송
        env:
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}             # 알림 채널 (쿠폰·새 시즌·스킨 공지)
          DISCORD_PATCH_CHANNEL_ID: ${{ vars.DISCORD_PATCH_CHANNEL_ID }} # 패치노트·핫픽스·점검 전용 채널
          DISCORD_VIDEO_CHANNEL_ID: ${{ vars.DISCORD_VIDEO_CHANNEL_ID }} # 유튜브 채널
          DISCORD_SKIN_CHANNEL_ID: ${{ vars.DISCORD_SKIN_CHANNEL_ID }}   # 유튜브 스킨 영상 전용 채널
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PATCH_WEBHOOK_URL: ${{ secrets.PATCH_WEBHOOK_URL }}
          YOUTUBE_WEBHOOK_URL: ${{ secrets.YOUTUBE_WEBHOOK_URL }}
          SKIN_WEBHOOK_URL: ${{ secrets.SKIN_WEBHOOK_URL }}
          PATCH_SOURCE: ${{ vars.PATCH_SOURCE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # /패치노트 AI 한 줄 요약 (없으면 원문 정리만)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}   # 봇 계정으로 올리기 (채널 ID와 같이)
          MENTION: ${{ vars.MENTION }}
          STEAM_KEYWORDS: ${{ vars.STEAM_KEYWORDS }}
          STEAM_PATCH_KEYWORDS: ${{ vars.STEAM_PATCH_KEYWORDS }}
          STEAM_EXCLUDE: ${{ vars.STEAM_EXCLUDE }}
          SEASON_WINDOW_DAYS: ${{ vars.SEASON_WINDOW_DAYS }}
          YOUTUBE_CHANNELS: ${{ vars.YOUTUBE_CHANNELS }}
          YOUTUBE_KEYWORDS: ${{ vars.YOUTUBE_KEYWORDS }}
          YOUTUBE_EXCLUDE: ${{ vars.YOUTUBE_EXCLUDE }}
          YOUTUBE_SHORTS: ${{ vars.YOUTUBE_SHORTS }}
          COUPON_REMIND_HOURS: ${{ vars.COUPON_REMIND_HOURS }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          YOUTUBE_NOTIFY: ${{ vars.YOUTUBE_NOTIFY }}
        run: python bot.py ${{ inputs.mode == 'test' && '--test' || inputs.mode == 'check' && '--check' || '' }}

      - name: 보낸 기록 · 명령어 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json data.json patchnotes.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "알림 기록 갱신" && git push)
